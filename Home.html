  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const tabs = document.getElementById('tabs');
      const overlay = document.getElementById('overlay');

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        tabs.style.display = 'none';
        overlay.style.display = 'block';
      } else {
        tabs.style.display = 'block';
        overlay.style.display = 'none';
      }
    }

    function simpanCatatan() {
      const isiCatatan = document.getElementById('noteArea').value;
      localStorage.setItem('catatanSidebar', isiCatatan);
    }

    function hapusCatatan() {
      if (confirm('Yakin ingin menghapus catatan?')) {
        localStorage.removeItem('catatanSidebar');
        document.getElementById('noteArea').value = '';
      }
    }

    window.onload = function() {
      const catatanTersimpan = localStorage.getItem('catatanSidebar');
      if (catatanTersimpan) {
        document.getElementById('noteArea').value = catatanTersimpan;
      }

      document.getElementById('overlay').addEventListener('click', toggleSidebar);
    }
  </script>
